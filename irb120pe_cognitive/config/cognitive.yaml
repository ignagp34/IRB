/**:
  ros__parameters:
    use_sim_time: true

    planning_frame: world
    # The Gazebo camera plugin reports frame_id "camera" but no TF is published
    # for that frame in this world. The URDF link the camera is mounted on is
    # "camera_link", which has a valid world<->camera_link TF.
    camera_frame: camera_link
    camera_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    detections_2d_topic: /irb120pe/perception/detections_2d
    detected_objects_service: /irb120pe/perception/get_detected_objects
    move_arm_service: /irb120pe/action/move_arm
    pick_and_place_service: /irb120pe/action/pick_and_place
    execute_instruction_service: /irb120pe/reasoning/execute_instruction
    arrange_objects_service: /irb120pe/reasoning/arrange_objects
    reasoning_trace_topic: /irb120pe/reasoning/trace
    execution_backend: legacy

    yolo_model_path: ""
    yolo_confidence: 0.5
    detection_period_sec: 0.5
    object_stale_after_sec: 3.0
    cube_size_m: 0.035
    table_height_m: 0.88
    pick_approach_z: 1.10
    pick_z: 1.07
    # tool0 is above the physical gripper; retain that offset when detection z changes.
    pick_z_offset_from_object: 0.17
    pick_approach_offset_from_object: 0.20
    # Arrangement and slot targets are object poses; convert them to tool0 goals.
    place_z_offset_from_object: 0.17
    place_approach_offset_z: 0.10
    # Altura (tool0) a la que se transporta el cubo en horizontal para librar a los vecinos.
    moveit_transit_z: 1.20
    # Holgura (m) sobre el destino al soltar: el cubo cae y se asienta en vez de
    # empotrarse en lo que tenga debajo (clave al apilar). Subir si al apilar rebota.
    place_release_clearance: 0.005
    # Verificacion de lazo cerrado: tras colocar, lee la pose REAL del cubo en Gazebo
    # (/gazebo/get_entity_state) y confirma que llego al destino. Resuelve la oclusion
    # al apilar (ve el cubo aunque este tapado). Apagar con verify_placement: false.
    verify_placement: true
    verify_position_tolerance: 0.05
    verify_settle_sec: 0.8

    moveit_group_name: irb120_arm
    moveit_end_effector_link: tool0
    moveit_planner_id: PTP
    moveit_planning_time: 10.0
    moveit_velocity_scaling: 0.05
    moveit_acceleration_scaling: 0.05
    moveit_action_timeout: 60.0
    moveit_position_tolerance: 0.01
    moveit_orientation_tolerance: 0.25
    moveit_grasp_orientation: [0.707, 0.707, 0.0, 0.0]
    moveit_extra_collision_object_ids: [sticker_1, sticker_2, sticker_3]
    moveit_use_gripper_controllers: true
    gripper_left_action: /egp64_finger_left_controller/gripper_cmd
    gripper_right_action: /egp64_finger_right_controller/gripper_cmd
    gripper_open_position: 0.0
    gripper_closed_position: 0.01
    gripper_max_effort: 10.0
    robot_model_name: irb120
    robot_attach_link: EE_egp64

    dry_run: false
    llm_provider: mock
    llm_model: gpt-4o-mini
    # Tope de tokens de salida por respuesta. Evita que OpenRouter reserve el maximo
    # del modelo (p.ej. 64000) y rechace por saldo insuficiente (error 402).
    llm_max_tokens: 1500
    # Tope de pasos del agente (tool-calls) para garantizar que SIEMPRE termina.
    llm_max_iterations: 8
    ollama_base_url: http://localhost:11434
    huggingface_endpoint_url: ""
    openrouter_base_url: "https://openrouter.ai/api/v1"
    openrouter_referer: ""
    openrouter_app_title: "IRB-120 Cognitive Cell"

    arrangement_grasp_orientation: [0.707, 0.707, 0.0, 0.0]
    arrangement_defaults:
      table_top_z: 0.90
      line_x: 0.55
      line_y: 0.40
      line_y_start: 0.30
      line_x_start: 0.30
      tower_x: 0.55
      tower_y: 0.52

    workspace_limits:
      x: [0.05, 0.75]
      y: [0.05, 0.85]
      z: [0.85, 1.65]

    tool0_workspace_limits:
      x: [0.05, 0.75]
      y: [0.05, 0.85]
      z: [0.95, 1.65]

    slots:
      slot_a:
        label: white_slot
        aliases: [slot_a, white_slot, left_container]
        pose: [0.105, 0.100, 0.90, 0.707, 0.707, 0.0, 0.0]
      slot_b:
        label: black_slot
        aliases: [slot_b, black_slot]
        pose: [0.105, 0.145, 0.90, 0.707, 0.707, 0.0, 0.0]
      slot_c:
        label: blue_slot
        aliases: [slot_c, blue_slot, right_container]
        pose: [0.150, 0.145, 0.90, 0.707, 0.707, 0.0, 0.0]
      unknown_slot:
        label: unknown_slot
        aliases: [unknown_slot, no_detection_slot]
        pose: [0.150, 0.100, 0.90, 0.707, 0.707, 0.0, 0.0]
